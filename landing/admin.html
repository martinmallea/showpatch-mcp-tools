<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShowPatch · Admin</title>
<style>
  :root{--bg:#0b0e13;--card:#141b24;--line:#232c38;--txt:#eef2f7;--dim:#93a0b1;--gold:#e0a03a;--ok:#3ecf8e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding:22px}
  .wrap{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{font-weight:800;letter-spacing:.16em;font-size:12px}
  .badge{font-size:10px;color:var(--gold);border:1px solid rgba(224,160,58,.4);border-radius:999px;padding:3px 8px}
  .right{margin-left:auto;display:flex;gap:8px}
  a.btn,button.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 12px;font-size:12px;text-decoration:none;cursor:pointer}
  h2{font-size:11px;letter-spacing:.12em;color:var(--dim);margin:22px 0 8px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi b{display:block;font-size:24px;line-height:1.1}
  .kpi span{font-size:11px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:9px 10px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-size:10.5px;letter-spacing:.08em;font-weight:600}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--dim)}
  .ok{color:var(--ok)}
  .empty{padding:14px;color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SHOWPATCH</div>
    <div class="badge">ADMIN</div>
    <div class="right">
      <a class="btn" href="/" >Landing</a>
      <a class="btn" id="appLink" href="http://127.0.0.1:8787/" target="_blank" rel="noopener">Abrir app</a>
      <button class="btn" id="refresh">Refrescar</button>
    </div>
  </header>

  <h2>RESUMEN</h2>
  <div class="cards">
    <div class="kpi"><b id="kSignups">—</b><span>registros</span></div>
    <div class="kpi"><b id="kWp">—</b><span>work packages</span></div>
    <div class="kpi"><b id="kCaptures">—</b><span>capturas DMX</span></div>
    <div class="kpi"><b id="kZip">—</b><span>ZIP de la beta</span></div>
  </div>

  <h2>REGISTROS</h2>
  <div id="signups"></div>

  <h2>CAPTURAS</h2>
  <div id="captures"></div>

  <h2>ENLACES</h2>
  <div id="links"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try{
    const r = await fetch('/api/admin');
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'error');

    $('kSignups').textContent = d.signups.count;
    $('kWp').textContent = `${d.project.done}/${d.project.total}`;
    $('kCaptures').textContent = d.captures.length;
    $('kZip').textContent = d.zip ? `${d.zip.kb} KB` : 'no';
    $('appLink').href = d.app || 'http://127.0.0.1:8787/';

    $('signups').innerHTML = d.signups.rows.length
      ? `<table><tr><th>CORREO</th><th>ROL</th><th>CONSOLA</th><th>PC</th><th>FECHA</th></tr>${
          d.signups.rows.slice().reverse().map(row => `<tr><td>${esc(row.email)}</td><td class="muted">${esc(row.role)}</td>
            <td class="muted">${esc(row.rig)}</td><td class="${row.pc_ack ? 'ok' : 'muted'}">${row.pc_ack ? 'sí' : 'no'}</td>
            <td class="muted">${esc((row.ts || '').slice(0, 16).replace('T', ' '))}</td></tr>`).join('')
        }</table>`
      : '<div class="empty">Todavía no hay registros. La landing los guarda en landing/data/signups.jsonl.</div>';

    $('captures').innerHTML = d.captures.length
      ? `<table><tr><th>FICHERO</th><th>TRAMAS</th><th>DURACIÓN</th><th>UNIVERSOS</th><th>TAMAÑO</th></tr>${
          d.captures.map(c => `<tr><td>${esc(c.name)}</td><td>${c.frames}</td><td>${c.seconds}s</td>
            <td class="muted">${c.universes.join(', ') || '—'}</td><td class="muted">${c.kb} KB</td></tr>`).join('')
        }</table>`
      : '<div class="empty">Sin capturas. Se crean desde la pestaña DMX live de la app.</div>';

    $('links').innerHTML = `<table>
      <tr><th>QUÉ</th><th>DÓNDE</th></tr>
      <tr><td>Repositorio</td><td class="muted">${esc(d.github)}</td></tr>
      <tr><td>Versión</td><td class="muted">${esc(d.version)}</td></tr>
      <tr><td>ZIP</td><td class="muted">${d.zip ? esc(d.zip.path) : 'no disponible'}</td></tr>
    </table>`;
  }catch(e){
    $('signups').innerHTML = `<div class="empty">Error: ${esc(e.message)}. ¿Está la landing arrancada con <code>python bridge.py landing</code>?</div>`;
  }
}
$('refresh').addEventListener('click', load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
